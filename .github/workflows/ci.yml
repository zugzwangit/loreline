name: ci
on:
  push:
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22.14.0", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level moderate
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.5", cache-dependency-path: services/gateway/go.sum }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ../intelligence
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: LORELINE_TEST_PYTHON=python go test -tags=integration ./internal/controlplane -run TestProductionLifecycle -v
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/intelligence } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/intelligence/requirements.lock }
      - run: pip install -r requirements.lock && pip install -e '.[test]' pip-audit
      - run: ruff format --check loreline_ai tests ../../scripts/verify_structure.py
      - run: ruff check loreline_ai tests ../../scripts/verify_structure.py
      - run: pytest --cov=loreline_ai --cov-report=term-missing --cov-fail-under=60
      - run: python -m compileall -q loreline_ai
      - run: pip-audit -r requirements.lock
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openapi-spec-validator==0.7.2
      - run: python scripts/verify_structure.py
      - run: python -m openapi_spec_validator api/openapi.yaml
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config -q
      - uses: docker/build-push-action@v6
        with: { context: services/gateway, push: false, tags: loreline-gateway:test }
      - uses: docker/build-push-action@v6
        with: { context: services/intelligence, push: false, tags: loreline-intelligence:test }
