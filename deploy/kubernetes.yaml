apiVersion: v1
kind: Namespace
metadata: { name: loreline }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: loreline, namespace: loreline }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: loreline-config, namespace: loreline }
data:
  LORELINE_AI_URL: http://intelligence:8090
  LORELINE_ALLOWED_ORIGINS: https://knowledge.example.com
  LORELINE_RATE_PER_MINUTE: "120"
  LORELINE_PROVIDER: extractive
  LORELINE_OBJECT_BUCKET: loreline-documents
  LORELINE_CONNECTOR_ALLOWED_HOSTS: example.atlassian.net,example.zendesk.com,api.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: loreline }
spec:
  replicas: 3
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: loreline
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: ghcr.io/your-org/loreline-gateway:1.1.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: loreline-config } }, { secretRef: { name: loreline-secrets } }]
          env: [{ name: LORELINE_AUTO_MIGRATE, value: "false" }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: loreline-migrate, namespace: loreline }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: loreline
      containers:
        - name: migrate
          image: ghcr.io/your-org/loreline-gateway:1.1.0
          command: ["/lorelinectl", "migrate"]
          envFrom: [{ secretRef: { name: loreline-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: loreline }
spec: { selector: { app: gateway }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: intelligence, namespace: loreline }
spec:
  replicas: 2
  selector: { matchLabels: { app: intelligence } }
  template:
    metadata: { labels: { app: intelligence } }
    spec:
      serviceAccountName: loreline
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: intelligence
          image: ghcr.io/your-org/loreline-intelligence:1.1.0
          command: [loreline-intelligence]
          ports: [{ name: http, containerPort: 8090 }]
          envFrom: [{ configMapRef: { name: loreline-config } }, { secretRef: { name: loreline-secrets } }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /livez, port: http }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: intelligence, namespace: loreline }
spec: { selector: { app: intelligence }, ports: [{ name: http, port: 8090, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: loreline }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      serviceAccountName: loreline
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/your-org/loreline-intelligence:1.1.0
          command: [loreline-worker]
          envFrom: [{ configMapRef: { name: loreline-config } }, { secretRef: { name: loreline-secrets } }]
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway, namespace: loreline }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gateway, namespace: loreline }
spec: { minAvailable: 2, selector: { matchLabels: { app: gateway } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: intelligence, namespace: loreline }
spec: { minAvailable: 1, selector: { matchLabels: { app: intelligence } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: worker, namespace: loreline }
spec: { minAvailable: 1, selector: { matchLabels: { app: worker } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: loreline }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-ingress, namespace: loreline }
spec:
  podSelector: { matchLabels: { app: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: intelligence-ingress, namespace: loreline }
spec:
  podSelector: { matchLabels: { app: intelligence } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ protocol: TCP, port: 8090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: application-egress, namespace: loreline }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: {} }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loreline
  namespace: loreline
  annotations: { nginx.ingress.kubernetes.io/proxy-read-timeout: "65" }
spec:
  tls: [{ hosts: [knowledge.example.com], secretName: loreline-tls }]
  rules:
    - host: knowledge.example.com
      http: { paths: [{ path: /v1, pathType: Prefix, backend: { service: { name: gateway, port: { number: 8080 } } } }] }
