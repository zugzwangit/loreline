apiVersion: v1
kind: Secret
metadata: { name: loreline-secrets, namespace: loreline }
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES:5432/loreline?sslmode=require
  LORELINE_DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES:5432/loreline?sslmode=require
  LORELINE_OBJECT_ENDPOINT: https://s3.example.com
  LORELINE_OBJECT_ACCESS_KEY: replace-me
  LORELINE_OBJECT_SECRET_KEY: replace-me
  LORELINE_PROVIDER_API_KEY: replace-me-if-used
