name: loreline
services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: loreline
      POSTGRES_USER: loreline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loreline-local-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loreline -d loreline"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: ["data"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loreline-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loreline-local-secret}
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: ["data"]

  intelligence:
    build: ./services/intelligence
    command: ["loreline-intelligence"]
    environment:
      LORELINE_AI_ADDR: 0.0.0.0:8090
      LORELINE_PROVIDER: ${LORELINE_PROVIDER:-extractive}
      LORELINE_PROVIDER_BASE_URL: ${LORELINE_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      LORELINE_PROVIDER_MODEL: ${LORELINE_PROVIDER_MODEL:-}
      LORELINE_PROVIDER_API_KEY: ${LORELINE_PROVIDER_API_KEY:-}
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: ["app"]

  worker:
    build: ./services/intelligence
    command: ["loreline-worker"]
    environment:
      LORELINE_DATABASE_URL: postgresql://loreline:${POSTGRES_PASSWORD:-loreline-local-only}@postgres:5432/loreline
      LORELINE_OBJECT_ENDPOINT: http://minio:9000
      LORELINE_OBJECT_BUCKET: loreline-documents
      LORELINE_OBJECT_ACCESS_KEY: ${MINIO_ROOT_USER:-loreline-local}
      LORELINE_OBJECT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-loreline-local-secret}
      LORELINE_WORKER_ID: worker
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: ["data"]

  gateway:
    build: ./services/gateway
    environment:
      DATABASE_URL: postgresql://loreline:${POSTGRES_PASSWORD:-loreline-local-only}@postgres:5432/loreline
      LORELINE_AI_URL: http://intelligence:8090
      LORELINE_ALLOWED_ORIGINS: ${LORELINE_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8088}
      LORELINE_AUTO_MIGRATE: "true"
      LORELINE_RATE_PER_MINUTE: ${LORELINE_RATE_PER_MINUTE:-120}
    expose: ["8080"]
    depends_on:
      postgres: { condition: service_healthy }
      intelligence: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/loreline-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: ["app","data"]

  edge:
    image: caddy:2.10-alpine
    environment:
      LORELINE_DOMAIN: ${LORELINE_DOMAIN:-localhost}
    ports: ["8088:80", "8443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: ["gateway"]
    restart: unless-stopped
    networks: ["app"]

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles: ["observability"]
    networks: ["app"]

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3002:3000"]
    profiles: ["observability"]
    networks: ["app"]

networks:
  app: {}
  data: { internal: true }
volumes:
  postgres-data: {}
  object-data: {}
  caddy-data: {}
  prometheus-data: {}
  grafana-data: {}
