[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loreline-intelligence"
version = "0.1.0"
description = "Grounded retrieval and answer service for Loreline"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=6,<7"]

[project.scripts]
loreline-intelligence = "loreline_ai.app:main"
loreline-worker = "loreline_ai.worker:main"

[tool.setuptools.packages.find]
include = ["loreline_ai*"]
